<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Aftercare Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #3498db;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .patient-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #3498db;
        }

        .patient-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item label {
            display: block;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 5px;
        }

        .info-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .checklist-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .checklist-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #e74c3c;
            transition: transform 0.3s ease;
        }

        .checklist-card:hover {
            transform: translateY(-2px);
        }

        .checklist-card.sleep {
            border-left-color: #9b59b6;
        }

        .checklist-card.exercise {
            border-left-color: #e67e22;
        }

        .checklist-card.medication {
            border-left-color: #27ae60;
        }

        .checklist-card.mood {
            border-left-color: #f39c12;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }

        .card-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .checklist-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .checklist-item.checked {
            background: #d5f4e6;
            border-left: 3px solid #27ae60;
        }

        .checklist-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
        }

        .checklist-item input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .rating-container {
            margin-top: 10px;
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .star {
            font-size: 1.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star.active {
            color: #f39c12;
        }

        .notes-section {
            margin-top: 15px;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
        }

        .submit-section {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .progress-bar {
            background: #ecf0f1;
            border-radius: 10px;
            height: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
        }

        .date-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .date-selector input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .checklist-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Mental Health Aftercare Checklist</h1>
            <p>Daily monitoring system for post-discharge care</p>
        </div>

        <div class="date-selector">
            <label for="checklistDate"><strong>Date:</strong></label>
            <input type="date" id="checklistDate" name="checklistDate">
        </div>

        <div class="patient-info">
            <h3>👤 Patient Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <label for="patientName">Patient Name:</label>
                    <input type="text" id="patientName" name="patientName" placeholder="Enter patient name">
                </div>
                <div class="info-item">
                    <label for="caregiverName">Caregiver/Family Member:</label>
                    <input type="text" id="caregiverName" name="caregiverName" placeholder="Your name">
                </div>
                <div class="info-item">
                    <label for="relationship">Relationship:</label>
                    <input type="text" id="relationship" name="relationship" placeholder="e.g., Spouse, Parent, Child">
                </div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="checklist-section">
            <div class="checklist-grid">
                <!-- Sleep Tracking Card -->
                <div class="checklist-card sleep">
                    <div class="card-title">
                        <span class="card-icon">😴</span>
                        Sleep & Rest
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="sleep-quality" data-category="sleep">
                            Slept for 7-8 hours last night
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="sleep-pattern" data-category="sleep">
                            Maintained regular sleep schedule
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="sleep-disturbance" data-category="sleep">
                            No significant sleep disturbances
                        </label>
                    </div>

                    <div class="rating-container">
                        <label><strong>Overall Sleep Quality:</strong></label>
                        <div class="rating-stars" data-rating="sleep-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                </div>

                <!-- Exercise & Activity Card -->
                <div class="checklist-card exercise">
                    <div class="card-title">
                        <span class="card-icon">🚶‍♂️</span>
                        Physical Activity
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="daily-walk" data-category="exercise">
                            Went for a walk or outdoor activity
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="exercise-routine" data-category="exercise">
                            Completed recommended exercise routine
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="physical-engagement" data-category="exercise">
                            Engaged in physical activities (minimum 30 min)
                        </label>
                    </div>

                    <div class="rating-container">
                        <label><strong>Activity Level Today:</strong></label>
                        <div class="rating-stars" data-rating="exercise-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                </div>

                <!-- Medication Adherence Card -->
                <div class="checklist-card medication">
                    <div class="card-title">
                        <span class="card-icon">💊</span>
                        Medication & Treatment
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="morning-meds" data-category="medication">
                            Took morning medications as prescribed
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="evening-meds" data-category="medication">
                            Took evening medications as prescribed
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="med-schedule" data-category="medication">
                            Followed medication schedule consistently
                        </label>
                    </div>

                    <div class="rating-container">
                        <label><strong>Medication Adherence:</strong></label>
                        <div class="rating-stars" data-rating="medication-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                </div>

                <!-- Mood & Social Engagement Card -->
                <div class="checklist-card mood">
                    <div class="card-title">
                        <span class="card-icon">😊</span>
                        Mood & Social Activity
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="social-interaction" data-category="mood">
                            Had meaningful social interaction
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="mood-stable" data-category="mood">
                            Mood remained stable throughout the day
                        </label>
                    </div>
                    
                    <div class="checklist-item">
                        <label>
                            <input type="checkbox" name="positive-activities" data-category="mood">
                            Engaged in enjoyable/positive activities
                        </label>
                    </div>

                    <div class="rating-container">
                        <label><strong>Overall Mood Today:</strong></label>
                        <div class="rating-stars" data-rating="mood-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="notes-section">
            <div class="section-title">📝 Additional Notes & Observations</div>
            <textarea id="dailyNotes" placeholder="Any additional observations, concerns, or positive developments you'd like to note for today..."></textarea>
        </div>

        <div class="submit-section">
            <button class="submit-btn" onclick="submitChecklist()">Save Daily Report</button>
        </div>
    </div>

    <script>
        // Set today's date by default
        document.getElementById('checklistDate').valueAsDate = new Date();

        // Handle checkbox interactions and progress tracking
        function updateProgress() {
            const totalCheckboxes = document.querySelectorAll('input[type="checkbox"]').length;
            const checkedBoxes = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const progress = (checkedBoxes / totalCheckboxes) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Add event listeners to checkboxes
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const checklistItem = this.closest('.checklist-item');
                if (this.checked) {
                    checklistItem.classList.add('checked');
                } else {
                    checklistItem.classList.remove('checked');
                }
                updateProgress();
            });
        });

        // Handle star ratings
        document.querySelectorAll('.rating-stars').forEach(ratingContainer => {
            const stars = ratingContainer.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.dataset.value);
                    const ratingName = ratingContainer.dataset.rating;
                    
                    // Clear all stars in this rating group
                    stars.forEach(s => s.classList.remove('active'));
                    
                    // Activate stars up to the clicked one
                    for (let i = 0; i < rating; i++) {
                        stars[i].classList.add('active');
                    }
                    
                    // Store the rating value
                    ratingContainer.dataset.selectedRating = rating;
                });
            });
        });

        // Submit checklist function
        function submitChecklist() {
            const checklistData = {
                date: document.getElementById('checklistDate').value,
                patientName: document.getElementById('patientName').value,
                caregiverName: document.getElementById('caregiverName').value,
                relationship: document.getElementById('relationship').value,
                checkedItems: [],
                ratings: {},
                notes: document.getElementById('dailyNotes').value,
                submittedAt: new Date().toISOString()
            };

            // Collect checked items
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                checklistData.checkedItems.push({
                    name: checkbox.name,
                    category: checkbox.dataset.category,
                    label: checkbox.closest('label').textContent.trim()
                });
            });

            // Collect ratings
            document.querySelectorAll('.rating-stars').forEach(ratingContainer => {
                const ratingName = ratingContainer.dataset.rating;
                const selectedRating = ratingContainer.dataset.selectedRating || 0;
                checklistData.ratings[ratingName] = parseInt(selectedRating);
            });

            // Store in localStorage (in a real application, this would be sent to a server)
            const existingData = JSON.parse(localStorage.getItem('aftercareReports') || '[]');
            existingData.push(checklistData);
            localStorage.setItem('aftercareReports', JSON.stringify(existingData));

            // Show success message
            alert(`Daily report saved successfully!\n\nPatient: ${checklistData.patientName}\nDate: ${checklistData.date}\nCompleted items: ${checklistData.checkedItems.length}\n\nThis information has been stored for healthcare provider review.`);

            // Optionally, reset the form
            if (confirm('Would you like to reset the form for tomorrow\'s entry?')) {
                location.reload();
            }
        }

        // Load existing data if editing today's entry
        function loadExistingData() {
            const today = new Date().toISOString().split('T')[0];
            const existingReports = JSON.parse(localStorage.getItem('aftercareReports') || '[]');
            const todayReport = existingReports.find(report => report.date === today);
            
            if (todayReport) {
                // Populate form fields
                document.getElementById('patientName').value = todayReport.patientName || '';
                document.getElementById('caregiverName').value = todayReport.caregiverName || '';
                document.getElementById('relationship').value = todayReport.relationship || '';
                document.getElementById('dailyNotes').value = todayReport.notes || '';
                
                // Restore checked items
                todayReport.checkedItems.forEach(item => {
                    const checkbox = document.querySelector(`input[name="${item.name}"]`);
                    if (checkbox) {
                        checkbox.checked = true;
                        checkbox.closest('.checklist-item').classList.add('checked');
                    }
                });
                
                // Restore ratings
                Object.keys(todayReport.ratings).forEach(ratingName => {
                    const ratingContainer = document.querySelector(`[data-rating="${ratingName}"]`);
                    if (ratingContainer) {
                        const rating = todayReport.ratings[ratingName];
                        const stars = ratingContainer.querySelectorAll('.star');
                        for (let i = 0; i < rating; i++) {
                            stars[i].classList.add('active');
                        }
                        ratingContainer.dataset.selectedRating = rating;
                    }
                });
                
                updateProgress();
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadExistingData();
        });
    </script>
</body>
</html>
